<!-- Consent banner. Nothing but the visitor's own choice is stored until they accept. -->
<div class="cookie" id="cookieBar" role="dialog" aria-live="polite" aria-labelledby="cookieTitle" hidden>
  <div class="cookie-ico"><svg><use href="#i-cookie"/></svg></div>
  <div class="cookie-body">
    <b id="cookieTitle" data-es="Usamos cookies">We use cookies</b>
    <p data-es="Usamos cookies propias para que el sitio funcione y recordar sus preferencias (idioma y accesibilidad). Las de medición solo se activan si usted las acepta.">We use first-party cookies to run the site and remember your preferences (language and accessibility). Measurement cookies are only enabled if you accept them.</p>
    <div class="cookie-actions">
      <button class="btn btn--sm" id="cookieAccept" data-es="Aceptar">Accept</button>
      <button class="btn btn--ghost btn--sm" id="cookieReject" data-es="Rechazar">Reject</button>
      <a class="tlink" href="legal.html#privacy" data-es="Privacidad y términos">Privacy &amp; terms</a>
    </div>
  </div>
  <button class="cookie-x" id="cookieClose" aria-label="Close" data-es-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>
