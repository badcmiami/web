<meta charset="utf-8">
{{base}}
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{url}}">
<meta name="theme-color" content="#001C77">
<meta name="format-detection" content="telephone=no">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Best American Diagnostic Center">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site}}/assets/img/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="es_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<meta name="twitter:image" content="{{site}}/assets/img/og-cover.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"MedicalBusiness",
  "@id":"{{site}}/#organization",
  "name":"Best American Diagnostic Center",
  "url":"{{site}}/",
  "logo":"{{site}}/assets/img/logo-lockup.svg",
  "image":"{{site}}/assets/img/og-cover.png",
  "telephone":"+1-305-681-7555",
  "faxNumber":"+1-305-681-7040",
  "priceRange":"$$",
  "availableLanguage":["en","es"],
  "medicalSpecialty":"Radiology",
  "areaServed":{"@type":"City","name":"Hialeah","addressRegion":"FL"},
  "address":[
    {"@type":"PostalAddress","streetAddress":"637 E 49th St","addressLocality":"Hialeah","addressRegion":"FL","postalCode":"33013","addressCountry":"US"},
    {"@type":"PostalAddress","streetAddress":"5005 E 8th Ave","addressLocality":"Hialeah","addressRegion":"FL","postalCode":"33013","addressCountry":"US"}
  ],
  "openingHoursSpecification":[
    {"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday"],"opens":"08:00","closes":"18:00"}
  ]
}
</script>
