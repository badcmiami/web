# Publishes the site to Hostinger over FTP.
#
# One-time setup, all of it inside GitHub — no credential ever leaves your
# account and nobody else sees it:
#
#   1. hPanel -> Files -> FTP Accounts. Note the FTP hostname, username and
#      password (use "Change account password" if you don't have it).
#   2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions ->
#      "New repository secret", three times:
#         FTP_SERVER     e.g. ftp.bestamerican.center   (or the IP hPanel shows)
#         FTP_USERNAME   e.g. u123456789.bestamerican.center
#         FTP_PASSWORD   the FTP password
#   3. GitHub -> Actions -> "Deploy to Hostinger" -> Run workflow.
#
# After that every push to this branch republishes the site automatically.
# The first run uploads everything; later runs send only what changed.

name: Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be uploaded without touching the server'
        type: boolean
        default: false
  push:
    branches:
      - claude/diagnostic-center-website-proposal-iskhcq
    paths-ignore:
      - 'README.md'
      - 'src/**'
      - 'dist/preview.html'

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Accept the usual spellings, so one wrong secret name does not block a
    # deploy. A secret that does not exist resolves to an empty string.
    env:
      FTP_SERVER: >-
        ${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.FTP_HOSTNAME }}
      FTP_USERNAME: >-
        ${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.FTP_LOGIN }}
      FTP_PASSWORD: >-
        ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.FTP_PWD || secrets.FTP_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the pages and collect what the server needs
        run: |
          python3 tools/build.py
          python3 tools/package.py --dir
          echo "Files to publish: $(find dist/site -type f | wc -l)"

      - name: Fail early if the build came out empty
        run: |
          test -f dist/site/index.html || { echo "index.html missing"; exit 1; }
          test -f dist/site/send.php   || { echo "send.php missing"; exit 1; }
          test -d dist/site/assets/photos || { echo "photos missing"; exit 1; }

      - name: Check that the FTP credentials arrived
        run: |
          miss=0
          if [ -n "$FTP_SERVER" ];   then echo "server   : set"; else echo "server   : MISSING"; miss=1; fi
          if [ -n "$FTP_USERNAME" ]; then echo "username : set"; else echo "username : MISSING"; miss=1; fi
          if [ -n "$FTP_PASSWORD" ]; then echo "password : set"; else echo "password : MISSING"; miss=1; fi
          if [ "$miss" != 0 ]; then
            echo ""
            echo "Add the missing value as a REPOSITORY secret (not a variable,"
            echo "not an environment secret) under Settings -> Secrets and"
            echo "variables -> Actions -> Secrets, named FTP_SERVER,"
            echo "FTP_USERNAME or FTP_PASSWORD, then run this workflow again."
            exit 1
          fi

      - name: Normalise and check the FTP host
        run: |
          v="$FTP_SERVER"
          # People paste what the panel shows them: ftp://host, https://host,
          # host/public_html, host:21. Accept all of it and reduce it to the
          # bare host the FTP client needs.
          clean="${v#*://}"
          clean="${clean%%/*}"
          clean="${clean%%:*}"
          clean="$(printf '%s' "$clean" | tr -d '[:space:]')"

          if [ "$clean" != "$v" ]; then
            echo "Normalised the stored host (stripped a scheme, path or port)."
          fi

          if ! getent hosts "$clean" >/dev/null 2>&1; then
            echo "The host still does not resolve after cleaning it up."
            echo "Open hPanel -> Files -> FTP Accounts and copy the FTP IP or"
            echo "hostname exactly as shown, with no ftp:// prefix, into"
            echo "FTP_SERVER at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Host resolves. Connecting."

          # Keep it masked in the log even though it is only a hostname.
          echo "::add-mask::$clean"
          echo "FTP_HOST=$clean" >> "$GITHUB_ENV"

      # Hostinger accepts FTPS on port 21. Try that first: the password never
      # crosses the wire in the clear. Some plans only answer plain FTP, so
      # fall back rather than leave the site unpublished.
      - name: Publish to public_html over FTPS
        id: ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/site/
          server-dir: /public_html/
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run == true }}
          # Never delete what the site writes at runtime
          exclude: |
            **/form-inbox.log
            **/.git*
            **/node_modules/**

      - name: Publish to public_html over plain FTP
        if: steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/site/
          server-dir: /public_html/
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            **/form-inbox.log
            **/.git*
            **/node_modules/**

      - name: Say where it went
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ "${{ steps.ftps.outcome }}" = "failure" ]; then
            echo "FTPS was refused; published over plain FTP instead."
          else
            echo "Published over FTPS."
          fi
          echo "The site should now answer at https://bestamerican.center"
