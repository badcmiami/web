      <line x1="0" y1="0" x2="0" y2="14" stroke="#001C77" stroke-width="1" opacity=".13"/>
    </pattern>
  </defs>
  <rect width="520" height="200" rx="14" fill="#F6F8FC"/>
  <rect width="520" height="200" rx="14" fill="url(#hatch)"/>
  <rect x="1" y="1" width="518" height="198" rx="13" fill="none" stroke="#001C77" stroke-width="2" stroke-dasharray="10 8" opacity=".38"/>
  <g fill="none" stroke="#001C77" stroke-width="2.4" opacity=".5" stroke-linecap="round">
    <circle cx="150" cy="100" r="30"/>
